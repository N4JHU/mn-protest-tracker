<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Cities Live Protest Map - Jan 26, 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hud-panel { position: absolute; background: rgba(0, 0, 0, 0.85); border: 1px solid #444; color: #ddd; padding: 15px; border-radius: 8px; backdrop-filter: blur(10px); z-index: 1000; max-width: 300px; }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; width: 280px; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 30px; right: 20px; }
        h2 { margin: 0 0 8px 0; font-size: 1.1rem; color: #ff5555; text-transform: uppercase; border-bottom: 1px solid #555; }
        p { font-size: 0.8rem; margin: 0 0 10px 0; color: #aaa; }
        .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .status-critical { background: #ff3333; color: white; }
        .status-warning { background: #ff9900; color: black; }
        .status-info { background: #3399ff; color: white; }
        .pulse-marker { width: 20px; height: 20px; background: rgba(255, 50, 50, 0.8); border-radius: 50%; border: 2px solid white; animation: pulse 2s infinite; }
        .pulse-marker.blue { background: rgba(50, 150, 255, 0.8); }
        .user-location-marker { width: 15px; height: 15px; background: #00ffff; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px #00ffff; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 50, 50, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0); } }
        .feed-item { border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 8px; }
        .feed-time { color: #ff5555; font-size: 0.7rem; font-weight: bold; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%; margin-top: 10px; }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="hud-panel top-left">
        <h2>Operation Metro Surge</h2>
        <div style="font-size: 0.8rem; color: #ccc;">
            <strong>DATE:</strong> Jan 26, 2026<br>
            <strong>LOCATION:</strong> Twin Cities, MN<br>
            <strong>STATUS:</strong> Civil Unrest
        </div>
    </div>
    <div class="hud-panel top-right">
        <h2>Live Intel Feed</h2>
        <div id="news-feed">
            <div class="feed-item"><div class="feed-time">10:05 AM</div><p>Crowds growing at Whipple Bldg. Tear gas deployed.</p></div>
            <div class="feed-item"><div class="feed-time">09:45 AM</div><p>Standoff at Lake & Chicago. Intersections blocked.</p></div>
        </div>
    </div>
    <div class="hud-panel bottom-left">
        <h2>Map Key</h2>
        <div><span style="color:#ff3333">●</span> High Tension Zone</div>
        <div><span style="color:#3399ff">●</span> Police Staging</div>
        <div><span style="color:#00ffff">●</span> Your Location</div>
    </div>
    <div class="hud-panel bottom-right">
        <button onclick="locateUser()">SHOW MY LOCATION</button>
        <div id="location-status" style="font-size: 0.7rem; color: #888; margin-top: 5px; text-align: center;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([44.92, -93.20], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors © CARTO' }).addTo(map);

        const redIcon = L.divIcon({ className: 'pulse-marker', iconSize: [20, 20] });
        const blueIcon = L.divIcon({ className: 'pulse-marker blue', iconSize: [20, 20] });
        const userIcon = L.divIcon({ className: 'user-location-marker', iconSize: [15, 15] });

        const incidents = [
            { pos: [44.8845, -93.2025], icon: redIcon, title: "Whipple Federal Bldg", status: "CRITICAL", desc: "Active conflict. 11 arrests." },
            { pos: [44.9483, -93.2633], icon: redIcon, title: "Lake St & Chicago Ave", status: "WARNING", desc: "Memorial vigil. Tense standoff." },
            { pos: [44.9543, -93.1022], icon: blueIcon, title: "MN State Capitol", status: "INFO", desc: "Legislative action/Protests." },
            { pos: [44.9750, -93.2590], icon: redIcon, title: "U.S. Bank Stadium", status: "WARNING", desc: "March start point." },
            { pos: [44.9790, -93.2760], icon: blueIcon, title: "Target Center", status: "INFO", desc: "Rally end point. Large police presence." },
            { pos: [44.9400, -93.1670], icon: blueIcon, title: "Cities Church", status: "WARNING", desc: "Previous clash site." }
        ];

        incidents.forEach(inc => {
            L.marker(inc.pos, { icon: inc.icon }).addTo(map)
                .bindPopup(`<strong>${inc.title}</strong><br><span class="status-badge status-${inc.status.toLowerCase()}">${inc.status}</span><br>${inc.desc}`);
        });

        let userMarker;
        function locateUser() {
            const status = document.getElementById('location-status');
            status.innerText = "Locating...";
            
            map.locate({setView: true, maxZoom: 13});
            
            map.on('locationfound', function(e) {
                status.innerText = "Location active";
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker(e.latlng, {icon: userIcon}).addTo(map)
                    .bindPopup("You are here").openPopup();
                
                incidents.forEach(inc => {
                    const dist = (map.distance(e.latlng, inc.pos) / 1609.34).toFixed(2);
                    console.log(`Distance to ${inc.title}: ${dist} miles`);
                });
            });
Fix location feature and add manual trigger button
            map.on('locationerror', function(e) {
                status.innerText = "Error: " + e.message;
                alert("Location access denied or unavailable.");
            });
        }

        setInterval(() => location.reload(), 60000);
    </script>
</body>
</html>
