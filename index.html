<!DOCTYPE html>
<html>
<head>
    <title>Twin Cities Live Protest Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #222; }
        
        .hud-panel { position: absolute; background: rgba(0,0,0,0.9); border: 1px solid #444; color: #ddd; padding: 8px; border-radius: 4px; z-index: 1000; font-size: 11px; }
        
        /* COMPACT HUD */
        .top-left { top: 10px; left: 10px; width: 135px; font-size: 9px; padding: 6px; }
        .top-left h2 { font-size: 0.6rem; margin-bottom: 3px; }
        .top-right { top: 10px; right: 10px; width: 160px; max-height: 40vh; overflow-y: auto; text-align: right; }
        
        /* SLIDER */
        .bottom-bar { bottom: 20px; left: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 1px solid #444; padding: 10px; border-radius: 8px; z-index: 1000; display: flex; flex-direction: column; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        input[type=range] { flex-grow: 1; accent-color: #ff5555; }
        
        h2 { margin: 0 0 5px 0; font-size: 0.75rem; color: #ff5555; border-bottom: 1px solid #ff5555; }
        
        /* CLICKABLE LAYERS */
        .info-row { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: center; }
        .layer-toggle { cursor: pointer; transition: opacity 0.2s; }
        .layer-toggle:hover { background: rgba(255,255,255,0.1); }
        .dimmed { opacity: 0.3; }

        /* COLORS */
        .red { color: #ff3333; } .blue { color: #0088ff; } .orange { color: #ffaa00; } .purple { color: #d400ff; } .grey { color: #888; }
        
        /* MARKERS */
        .pulse-marker { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px black; }
        .type-protest { background: #ff3333; box-shadow: 0 0 10px #ff3333; }
        .type-police { background: #0088ff; }
        .type-road_closure { background: #ffaa00; }
        .type-report { background: #d400ff; box-shadow: 0 0 8px #d400ff; }
        .type-intel { background: #888; }
        .type-user { background: #00ccff; }
        
        /* DRAFT MARKER (The Draggable One) */
        .draft-marker { width: 16px; height: 16px; background: rgba(212, 0, 255, 0.5); border: 2px solid #d400ff; border-radius: 50%; box-shadow: 0 0 15px #d400ff; cursor: crosshair; }
        
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); } 70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); } }

        /* MODAL */
        #report-modal { display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 85%; max-width: 320px; background: rgba(0,0,0,0.95); border: 1px solid #d400ff; z-index: 2000; padding: 15px; border-radius: 8px; }
        .form-input, select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
        .btn { background: #222; border: 1px solid #555; color: #ccc; padding: 8px 12px; font-size: 11px; cursor: pointer; border-radius: 4px; }
        .instruction { color: #d400ff; font-size: 10px; margin-bottom: 10px; text-align: center; font-style: italic; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="hud-panel top-left">
        <h2>METRO SURGE <span id="clock" style="float:right; color:#888">...</span></h2>
        <div class="info-row"><span>STATUS:</span> <span class="red">LIVE</span></div>
        <div class="info-row"><span>GPS:</span> <label class="switch"><input type="checkbox" id="gps-toggle"> GPS</label></div>
        
        <div style="margin-top:5px; border-top:1px solid #444; padding-top:2px;">
            <div class="info-row layer-toggle" id="row-protest" onclick="toggleLayer('protest')">
                <span>THREATS:</span> <span class="red" id="c-protest">0</span>
            </div>
            <div class="info-row layer-toggle" id="row-police" onclick="toggleLayer('police')">
                <span>POLICE:</span> <span class="blue" id="c-police">0</span>
            </div>
            <div class="info-row layer-toggle" id="row-report" onclick="toggleLayer('report')">
                <span>REPORTS:</span> <span class="purple" id="c-report">0</span>
            </div>
            <div class="info-row layer-toggle" id="row-road_closure" onclick="toggleLayer('road_closure')">
                <span>TRAFFIC:</span> <span class="orange" id="c-road">0</span>
            </div>
            <div class="info-row layer-toggle" id="row-intel" onclick="toggleLayer('intel')">
                <span>INTEL:</span> <span class="grey" id="c-intel">0</span>
            </div>
        </div>
        <div id="status" style="text-align:right; color:#555; margin-top:5px">...</div>
    </div>

    <div class="hud-panel top-right">
        <h2>INTEL <button class="btn" onclick="openModal()">RPT</button></h2>
        <div id="feed"></div>
    </div>

    <div class="hud-panel bottom-bar">
        <div style="font-size:10px; color:#aaa; margin-bottom:5px; display:flex; justify-content:space-between;">
            <span>HISTORY (-48H)</span>
            <span id="time-label" style="color:#ff5555; font-weight:bold;">LIVE NOW</span>
        </div>
        <div class="slider-container">
            <input type="range" id="time-slider" min="0" max="100" value="100">
        </div>
    </div>

    <div id="report-modal">
        <h2 style="color:#d400ff; text-align:center;">NEW REPORT</h2>
        <div class="instruction">DRAG PURPLE DOT OR USE GPS</div>
        
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <button class="btn" style="flex:1; border-color:#00ccff; color:#00ccff;" onclick="useMyLoc()">USE MY GPS</button>
            <button class="btn" style="flex:1" onclick="geoSearch()">SEARCH ADDR</button>
        </div>
        
        <input id="geo-input" class="form-input" placeholder="Address (Optional)...">
        
        <select id="rpt-type">
            <option value="Protest">Threat / Protest</option>
            <option value="Police">Police Activity</option>
            <option value="Traffic">Road Block / Traffic</option>
            <option value="Other">Other Intel</option>
        </select>
        <textarea id="rpt-desc" class="form-input" rows="3" placeholder="Description..."></textarea>
        
        <div style="display:flex; justify-content:space-between; gap:10px;">
            <button class="btn" style="flex:1" onclick="closeModal()">CANCEL</button>
            <button class="btn" style="flex:1; background:#d400ff; color:black; font-weight:bold;" onclick="submitReport()">SUBMIT</button>
        </div>
    </div>

    <script>
        const DB = window.supabase.createClient('https://mymlbldoignrhvkfqcnz.supabase.co', 'sb_publishable_Yce1uZCUK7isWfD7t8c5iA_Yi9OhtVh');
        let map, markers=[], allData=[], userMarker, watchId;
        let draftMarker = null; // The ghost marker for reporting
        
        let visibleLayers = { protest: true, police: true, road_closure: true, intel: true, report: true, user: true };

        function init() {
            map = L.map('map', {zoomControl:false}).setView([44.9778, -93.2650], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:19}).addTo(map);
            loadData();
            setInterval(loadData, 60000);
            
            document.getElementById('time-slider').addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                filterByTime(val);
            });
            setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
            setupGPS();
        }

        function toggleLayer(type) {
            visibleLayers[type] = !visibleLayers[type];
            const row = document.getElementById(`row-${type}`);
            if(visibleLayers[type]) row.classList.remove('dimmed'); else row.classList.add('dimmed');
            render(currentSubset || allData);
        }

        async function loadData() {
            status("SYNC...", "#ea0");
            const { data } = await DB.from('events').select('*').gt('timestamp', new Date(Date.now()-172800000).toISOString());
            if(data) {
                allData = data.filter(e => !e.title.includes("TRAFFIC: None"));
                if(document.getElementById('time-slider').value == 100) render(allData);
                status("SECURE", "#0f0");
            }
        }
        
        let currentSubset = null;

        function filterByTime(val) {
            if(val == 100) {
                document.getElementById('time-label').innerText = "LIVE NOW";
                currentSubset = allData;
                render(allData);
                return;
            }
            const hoursBack = 48 - (val * 0.48);
            const cutoff = new Date(Date.now() - (hoursBack * 3600000));
            document.getElementById('time-label').innerText = cutoff.toLocaleTimeString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
            currentSubset = allData.filter(e => new Date(e.timestamp) <= cutoff && new Date(e.timestamp) > new Date(cutoff - 86400000));
            render(currentSubset);
        }

        function render(dataset) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            document.getElementById('feed').innerHTML = "";
            let counts = { protest:0, police:0, road_closure:0, intel:0, report:0 };

            dataset.sort((a,b) => getPriority(b.type) - getPriority(a.type));
            
            dataset.forEach(e => {
                if(counts[e.type] !== undefined) counts[e.type]++;
                if(visibleLayers[e.type]) {
                    const z = getPriority(e.type);
                    const icon = L.divIcon({className:'', html:`<div class="pulse-marker type-${e.type} pulse"></div>`});
                    const m = L.marker([e.lat, e.lng], {icon:icon, zIndexOffset:z}).addTo(map)
                        .bindPopup(`<b style="color:${getColorClass(e.type)}">${e.title}</b><br>${e.desc}`);
                    markers.push(m);
                    
                    const d = document.createElement('div');
                    d.style.marginBottom = "5px"; d.style.borderBottom="1px solid #333";
                    d.innerHTML = `<span class="${getColorClass(e.type)}" style="font-weight:bold">${e.title}</span><br><span style="color:#aaa">${e.desc.substring(0,60)}...</span>`;
                    document.getElementById('feed').appendChild(d);
                }
            });

            document.getElementById('c-protest').innerText = counts.protest;
            document.getElementById('c-police').innerText = counts.police;
            document.getElementById('c-road').innerText = counts.road_closure;
            document.getElementById('c-intel').innerText = counts.intel;
            document.getElementById('c-report').innerText = counts.report;
        }

        function getPriority(t) { return t==='protest'?1000 : t==='report'?900 : t==='police'?800 : t==='road_closure'?500 : 100; }
        function getColorClass(t) { return t==='protest'?'red':t==='police'?'blue':t==='report'?'purple':t==='road_closure'?'orange':'grey'; }
        function status(m,c) { const e=document.getElementById('status'); e.innerText=m; e.style.color=c; }
        
        // --- NEW REPORTING LOGIC ---
        
        function openModal() {
            document.getElementById('report-modal').style.display='block';
            
            // Create a Purple Draggable Marker at center screen
            const center = map.getCenter();
            const icon = L.divIcon({className:'', html:'<div class="draft-marker"></div>', iconSize:[16,16], iconAnchor:[8,8]});
            
            if(draftMarker) map.removeLayer(draftMarker);
            draftMarker = L.marker(center, {draggable: true, icon: icon, zIndexOffset: 2000}).addTo(map);
            
            // Pan map slightly so pin isn't hidden by modal
            map.panTo([center.lat + 0.005, center.lng]);
        }

        function closeModal() {
            document.getElementById('report-modal').style.display='none';
            if(draftMarker) {
                map.removeLayer(draftMarker);
                draftMarker = null;
            }
        }
        
        function useMyLoc() {
            if(!navigator.geolocation) return alert("GPS not supported");
            status("LOCATING...", "#ea0");
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                
                if(draftMarker) {
                    draftMarker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 16); // Zoom in on user
                    status("GPS LOCKED", "#d400ff");
                }
            }, err => {
                alert("Could not get GPS location");
                status("GPS ERROR", "red");
            }, {enableHighAccuracy: true});
        }
        
        async function submitReport() {
            const t=document.getElementById('rpt-type').value;
            const d=document.getElementById('rpt-desc').value;
            
            if(!d) return alert("Description required");
            if(!draftMarker) return alert("Error: No location pin set");
            
            const loc = draftMarker.getLatLng(); // GET EXACT PIN LOCATION
            
            await DB.from('events').insert([{
                id:`usr-${Date.now()}`, 
                title:`RPT: ${t}`, 
                desc:d, 
                type:'report', 
                lat:loc.lat, 
                lng:loc.lng, 
                timestamp:new Date().toISOString()
            }]);
            
            loadData();
            closeModal();
        }
        
        function geoSearch() {
            const q = document.getElementById('geo-input').value;
            if(!q) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q} Minnesota`).then(r=>r.json()).then(d=>{
                if(d[0]) {
                    const lat = parseFloat(d[0].lat);
                    const lng = parseFloat(d[0].lon);
                    
                    if(draftMarker) {
                        draftMarker.setLatLng([lat, lng]);
                        map.setView([lat, lng], 15);
                    }
                    status("LOC FOUND", "#d400ff");
                }
            });
        }

        function setupGPS() { 
            document.getElementById('gps-toggle').addEventListener('change', function() {
                if(this.checked && navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(p => {
                        const lat=p.coords.latitude, lng=p.coords.longitude;
                        if(userMarker) map.removeLayer(userMarker);
                        userMarker = L.marker([lat,lng], {icon:L.divIcon({className:'', html:'<div class="pulse-marker type-user pulse"></div>'})}).addTo(map);
                        map.setView([lat,lng], 14);
                    }, e => { alert("GPS Error"); this.checked=false; }, {enableHighAccuracy:true});
                } else {
                    if(watchId) navigator.geolocation.clearWatch(watchId);
                    if(userMarker) map.removeLayer(userMarker);
                }
            });
        }

       if('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const newWorker = reg.installing;
                    newWorker.onstatechange = () => {
                        // If a new update is installed, reload automatically
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            });
        }
        init();
    </script>
</body>
</html>
