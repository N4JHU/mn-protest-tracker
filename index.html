<!DOCTYPE html>
<html>
<head>
    <title>MN Tactical Live Map</title>
    <style>
        /* --- GLOBAL SETTINGS --- */
        body { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; }

        /* --- TACTICAL HUD (Top Left) --- */
        #hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            background: rgba(0, 0, 0, 0.9); /* Deep Black */
            border: 1px solid #333;
            border-top: 3px solid #ff3333; /* Red Top Accent */
            padding: 15px;
            width: 300px;
            color: #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* HUD Typography */
        #hud-panel h2 { 
            margin: 0 0 10px 0; 
            font-size: 18px; 
            color: #ff3333; /* Red Title */
            text-transform: uppercase; 
            letter-spacing: 1px;
            font-weight: 700;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            border-bottom: 1px solid #222;
            padding-bottom: 4px;
        }
        
        .hud-label { color: #888; font-weight: 600; }
        .hud-value { color: #fff; font-weight: bold; }
        .hud-value.red { color: #ff3333; }

        /* --- POPUP (INFO WINDOW) STYLE --- */
        /* Restore standard Google White Bubble but customized */
        .gm-style-iw {
            padding: 0 !important;
            overflow: hidden !important;
        }
        
        .custom-popup {
            max-width: 300px;
            font-family: 'Segoe UI', sans-serif;
        }

        .popup-header {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
        }

        .popup-badge {
            display: inline-block;
            background: #ff3333;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 2px;
            text-transform: uppercase;
        }
        .popup-badge.road { background: #ffaa00; } /* Orange for roads */

        .popup-body {
            padding: 10px 15px;
            font-size: 13px;
            color: #444;
            line-height: 1.4;
        }

        /* --- PULSING MARKERS --- */
        .pulse-marker {
            width: 14px; height: 14px;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 0 rgba(0, 0, 0, 1);
            border: 2px solid white; /* White ring for visibility */
        }

        .type-protest { background: #ff3333; }
        .type-protest.pulse { animation: pulse-red 2s infinite; }

        .type-road { background: #ffaa00; }
        .type-road.pulse { animation: pulse-orange 2s infinite; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 170, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0); }
        }
    </style>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQwEfQg_ECrQw744IEqmR-XmxAt2lcT1I&callback=initMap" async defer></script>
</head>
<body>

<div id="hud-panel">
    <h2>OPERATION METRO SURGE</h2>
    
    <div class="hud-row">
        <span class="hud-label">LOCATION:</span>
        <span class="hud-value">TWIN CITIES, MN</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">STATUS:</span>
        <span class="hud-value red">LIVE MONITORING</span>
    </div>
    
    <br>
    
    <div class="hud-row">
        <span class="hud-label">ACTIVE THREATS</span>
        <span class="hud-value red" id="count-protest">0</span>
    </div>
    <div class="hud-row">
        <span class="hud-label">ROAD CLOSURES</span>
        <span class="hud-value" style="color:#ffaa00" id="count-road">0</span>
    </div>

    <div style="margin-top:10px; font-size:10px; color:#555; text-align:right;" id="last-updated">
        WAITING FOR DATA...
    </div>
</div>

<div id="map"></div>

<script>
    function initMap() {
        class HTMLMarker extends google.maps.OverlayView {
            constructor(position, type, title, desc, map) {
                super();
                this.position = position;
                this.type = type;
                this.title = title;
                this.desc = desc;
                this.div = null;
                this.setMap(map);
            }

            onAdd() {
                const div = document.createElement("div");
                div.className = `pulse-marker type-${this.type === 'protest' ? 'protest' : 'road'} pulse`;
                
                // CLICK EVENT: Open the new "White Box" Popup
                div.addEventListener("click", () => {
                    const badgeText = this.type === 'protest' ? 'ACTIVE CONFLICT' : 'TRAFFIC ALERT';
                    const badgeClass = this.type === 'protest' ? 'popup-badge' : 'popup-badge road';
                    
                    const contentString = `
                        <div class="custom-popup">
                            <div class="popup-header">
                                <div class="popup-title">${this.title}</div>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="popup-body">
                                ${this.desc}
                            </div>
                        </div>
                    `;

                    const infoWindow = new google.maps.InfoWindow({
                        content: contentString,
                        position: this.position
                    });
                    infoWindow.open(this.getMap());
                });

                this.div = div;
                const panes = this.getPanes();
                panes.overlayMouseTarget.appendChild(div);
            }

            draw() {
                const overlayProjection = this.getProjection();
                const position = overlayProjection.fromLatLngToDivPixel(this.position);
                if (this.div) {
                    this.div.style.left = position.x + "px";
                    this.div.style.top = position.y + "px";
                }
            }

            onRemove() {
                if (this.div) {
                    this.div.parentNode.removeChild(this.div);
                    this.div = null;
                }
            }
        }

        // DARK MAP STYLE (Preserved)
        const darkStyle = [
            { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
            { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
            { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
            { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
        ];

        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 10,
            center: { lat: 44.9778, lng: -93.2650 },
            styles: darkStyle, 
            disableDefaultUI: true 
        });

        // DATA LOADER
        let activeMarkers = [];

        function updateMapData() {
            fetch('events.json?nocache=' + (new Date()).getTime())
                .then(response => response.json())
                .then(data => {
                    document.getElementById('last-updated').innerText = "LAST SYNC: " + data.last_updated;
                    
                    activeMarkers.forEach(marker => marker.setMap(null));
                    activeMarkers = [];

                    let pCount = 0;
                    let rCount = 0;
                    const now = new Date();
                    const protestCutoff = new Date(now.getTime() - (48 * 60 * 60 * 1000)); // 48h for protests

                    data.features.forEach(event => {
                        let showEvent = false;

                        if (event.type === 'road_closure') {
                            showEvent = true;
                        } 
                        else if (event.type === 'protest') {
                            if (event.timestamp) {
                                const t = new Date(event.timestamp);
                                if (!isNaN(t) && t >= protestCutoff) showEvent = true;
                            } else {
                                showEvent = true; 
                            }
                        }

                        if (showEvent) {
                            const pos = new google.maps.LatLng(event.lat, event.lng);
                            const newMarker = new HTMLMarker(pos, event.type, event.title, event.desc, map);
                            activeMarkers.push(newMarker);

                            if(event.type === 'protest') pCount++;
                            if(event.type === 'road_closure') rCount++;
                        }
                    });

                    document.getElementById('count-protest').innerText = pCount;
                    document.getElementById('count-road').innerText = rCount;
                });
        }

        updateMapData();
        setInterval(updateMapData, 60000); 
    }
</script>
</body>
</html>
