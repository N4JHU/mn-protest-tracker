<!DOCTYPE html>
<html>
<head>
    <title>Twin Cities Live Protest Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #222; }
        
        /* HUD PANELS - MOBILE OPTIMIZED */
        .hud-panel {
            position: absolute; background: rgba(0, 0, 0, 0.9); border: 1px solid #444; color: #ddd;
            padding: 8px; border-radius: 4px; backdrop-filter: blur(5px); z-index: 1000;
            font-size: 11px;
        }
        
        /* Layout */
        .top-left { top: 10px; left: 10px; width: 180px; }
        .top-right { top: 10px; right: 10px; width: 160px; max-height: 40vh; overflow-y: auto; text-align: right; }
        .bottom-left { bottom: 20px; left: 10px; pointer-events: none; }
        
        h2 { margin: 0 0 5px 0; font-size: 0.75rem; color: #ff5555; text-transform: uppercase; border-bottom: 1px solid #ff5555; padding-bottom: 2px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .info-val { color: #fff; font-weight: bold; }
        .red { color: #ff5555; } .orange { color: #ffaa00; } .purple { color: #d400ff; }

        /* SWITCH */
        .switch { position: relative; display: inline-block; width: 24px; height: 12px; vertical-align: middle; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 12px; }
        .slider:before { position: absolute; content: ""; height: 8px; width: 8px; left: 2px; bottom: 2px; background: #888; border-radius: 50%; transition: .2s; }
        input:checked + .slider { background: #004400; }
        input:checked + .slider:before { transform: translateX(12px); background: #00ff00; }

        /* BUTTONS */
        .tac-btn, .rpt-btn { background: #222; border: 1px solid #555; color: #ccc; padding: 2px 5px; font-size: 10px; cursor: pointer; text-decoration: none; margin-left: 3px; display: inline-block; }
        .tac-btn { border-color: #ff5555; color: #ff5555; }
        .rpt-btn { border-color: #d400ff; color: #d400ff; }

        /* MARKERS */
        .pulse-marker { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px black; }
        .type-protest { background: #ff3333; }
        .type-road { background: #ffaa00; }
        .type-user { background: #00ccff; }
        .type-report { background: #d400ff; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0,0,0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0, 0); } }

        /* MODAL */
        #report-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 300px; background: #111; border: 1px solid #d400ff; z-index: 2000; padding: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-input, select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-panel top-left">
        <h2>METRO SURGE <span id="clock-display" style="color:#888; float:right; font-size:9px;">...</span></h2>
        <div class="info-row"><span>STATUS:</span> <span class="red">LIVE</span></div>
        <div class="info-row">
            <span>MY POS:</span> 
            <label class="switch"><input type="checkbox" id="user-loc-toggle"><span class="slider"></span></label>
        </div>
        <div class="info-row" style="margin-top:5px; border-top:1px solid #333; padding-top:2px;">
            <span>THREATS:</span> <span class="red" id="count-protest">0</span>
        </div>
        <div class="info-row"><span>REPORTS:</span> <span class="purple" id="count-report">0</span></div>
        <div id="connection-status" style="font-size:9px; color:#555; text-align:right; margin-top:3px;">Connecting...</div>
    </div>

    <div class="hud-panel top-right">
        <h2>INTEL <button class="rpt-btn" onclick="openReportModal()">RPT</button></h2>
        <div id="feed-container"></div>
    </div>

    <div id="report-modal">
        <h2 style="color:#d400ff">FIELD REPORT</h2>
        <div class="form-group">
            <input type="text" id="geo-input" class="form-input" placeholder="Location (e.g. Lake St)">
            <button class="tac-btn" style="width:100%; margin-top:5px;" onclick="performGeoSearch()">FIND LOCATION</button>
            <div id="geo-status" style="font-size:10px; color:#888; margin-top:2px;">* Finds center if empty</div>
        </div>
        <select id="rpt-type" class="form-group"><option value="Protest">Protest</option><option value="Police">Police</option><option value="Traffic">Traffic</option></select>
        <input type="text" id="rpt-desc" class="form-input form-group" placeholder="Description...">
        <div style="display:flex; justify-content:space-between;">
            <button class="tac-btn" onclick="closeReportModal()">CANCEL</button>
            <button class="rpt-btn" onclick="submitReport()">SUBMIT</button>
        </div>
    </div>

    <script>
    // --- 1. SUPABASE CONFIG ---
    const SB_URL = 'https://mymlbldoignrhvkfqcnz.supabase.co'; 
    const SB_KEY = 'sb_publishable_Yce1uZCUK7isWfD7t8c5iA_Yi9OhtVh';
    const metroDB = window.supabase.createClient(SB_URL, SB_KEY);

    // --- GLOBALS ---
    let map; 
    let activeMarkers = []; 
    let foundLocation = null;
    let userMarker = null;
    let watchId = null; // NEW: Tracks the GPS process so we can kill it

    // --- LEAFLET MAP INIT ---
    function initMap() {
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([44.9778, -93.2650], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        
        loadInitialData();
        subscribeToLiveUpdates();
        setupUserLocation();
    }

    // --- 2. USER LOCATION FIX ---
    function setupUserLocation() {
        const el = document.getElementById('user-loc-toggle');
        el.addEventListener('change', function() {
            if(this.checked) {
                // TURN ON
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(pos => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        
                        // Update Marker
                        if(userMarker) map.removeLayer(userMarker);
                        const userIcon = L.divIcon({className:'', html:`<div class="pulse-marker type-user pulse"></div>`, iconSize:[20,20], iconAnchor:[10,10]});
                        userMarker = L.marker([lat, lng], {icon: userIcon}).addTo(map);
                        
                        // Pan Map
                        map.setView([lat, lng], 14);
                    }, err => {
                        console.error(err);
                        this.checked = false; // Turn off if error
                        alert("GPS Error: " + err.message);
                    }, { enableHighAccuracy: true });
                }
            } else {
                // TURN OFF (The Fix)
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId); // STOP TRACKING
                    watchId = null;
                }
                if (userMarker) {
                    map.removeLayer(userMarker); // REMOVE DOT
                    userMarker = null;
                }
            }
        });
    }

    // --- 3. LIVE DATA ENGINE ---
    function createPulseMarker(lat, lng, type, title, desc) {
        const pulseIcon = L.divIcon({ className:'', html:`<div class="pulse-marker type-${type} pulse"></div>`, iconSize:[20,20], iconAnchor:[10,10] });
        const marker = L.marker([lat, lng], {icon: pulseIcon}).addTo(map);
        const popupContent = `<div class="popup-box"><div class="popup-title" style="color:${getColor(type)}">${title}</div><div class="popup-desc">${desc}</div></div>`;
        marker.bindPopup(popupContent);
        return marker;
    }

    function getColor(type) {
        if(type === 'report') return '#d400ff';
        if(type === 'protest') return '#ff5555';
        if(type === 'road_closure') return '#ffaa00';
        return '#00ccff';
    }

    async function loadInitialData() {
        document.getElementById('connection-status').innerText = "Fetching Data...";
        const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        const { data, error } = await metroDB.from('events').select('*').gt('timestamp', yesterday);

        if (error) { document.getElementById('connection-status').innerText = "DATA ERROR"; return; }

        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];
        let p=0, r=0, rep=0;
        document.getElementById('feed-container').innerHTML = ""; // Clear feed

        if(data) {
            data.forEach(e => {
                const m = createPulseMarker(e.lat, e.lng, e.type, e.title, e.desc);
                activeMarkers.push(m);
                addFeedItem(e); // Populate feed
                if(e.type==='protest') p++; if(e.type==='road_closure') r++; if(e.type==='report') rep++;
            });
        }
        updateCounts(p, r, rep);
        document.getElementById('connection-status').innerText = "LIVE (SECURE)";
        document.getElementById('connection-status').style.color = "#00ff00";
    }

    function subscribeToLiveUpdates() {
        metroDB.channel('live_events').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, payload => {
            const e = payload.new;
            const m = createPulseMarker(e.lat, e.lng, e.type, e.title, e.desc);
            activeMarkers.push(m);
            addFeedItem(e);
            
            // Auto-update counts (simplified)
            let p = parseInt(document.getElementById('count-protest').innerText);
            let r = parseInt(document.getElementById('count-road').innerText);
            let rep = parseInt(document.getElementById('count-report').innerText);
            if(e.type==='protest') p++; if(e.type==='road_closure') r++; if(e.type==='report') rep++;
            updateCounts(p, r, rep);

            const s = document.getElementById('connection-status');
            s.innerText = "INCOMING INTEL..."; s.style.color = "white";
            setTimeout(() => { s.innerText = "LIVE (SECURE)"; s.style.color = "#00ff00"; }, 2000);
        }).subscribe();
    }

    function updateCounts(p, r, rep) {
        document.getElementById('count-protest').innerText = p;
        document.getElementById('count-road').innerText = r;
        document.getElementById('count-report').innerText = rep;
    }

    // --- 4. SUBMIT & UTILS ---
    async function submitReport() {
        const t = document.getElementById('rpt-type').value;
        const d = document.getElementById('rpt-desc').value;
        if(!d) return alert("Desc required");
        let lat, lng;
        if(foundLocation) { lat=foundLocation.lat; lng=foundLocation.lng; } 
        else { const c=map.getCenter(); lat=c.lat; lng=c.lng; }

        await metroDB.from('events').insert([{ id:`usr-${Date.now()}`, title:`RPT: ${t}`, desc:d, type:'report', lat:lat, lng:lng, timestamp:new Date().toISOString() }]);
        closeReportModal();
        document.getElementById('rpt-desc').value = "";
    }

    function executeTwitterScan() {
        const k = '("#MinneapolisProtest" OR "#ICE" OR "#ImmigrationAgents" OR "#WhippleFederalBuilding" OR "#BreakingNews") -filter:replies';
        window.open(`https://twitter.com/search?q=${encodeURIComponent(k)}&src=typed_query&f=live`, '_blank');
    }

    function performGeoSearch() {
        const q = document.getElementById('geo-input').value;
        if(!q) return;
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+" Minnesota")}`).then(r=>r.json()).then(d=>{
            if(d[0]) { 
                foundLocation={lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon)}; 
                map.setView([foundLocation.lat,foundLocation.lng], 15); 
                L.circleMarker([foundLocation.lat,foundLocation.lng],{color:'green',radius:10}).addTo(map);
                document.getElementById('geo-status').innerText="LOCKED"; 
                document.getElementById('geo-status').style.color="#0f0"; 
            }
        });
    }

    function openReportModal(){document.getElementById('report-modal').style.display='block'}
    function closeReportModal(){document.getElementById('report-modal').style.display='none'}
    
    function addFeedItem(e) {
        const c = document.getElementById('feed-container');
        const t = new Date(e.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        let col = getColor(e.type);
        const d = document.createElement('div');
        d.className = "feed-item";
        d.innerHTML = `<div class="feed-header"><span class="feed-time">${t}</span></div><div class="feed-text"><strong style="color:${col}">${e.title}</strong><br>${e.desc.substring(0,80)}...</div>`;
        c.insertBefore(d, c.firstChild);
    }

    setInterval(()=>{document.getElementById('clock-display').innerText=new Date().toLocaleTimeString()},1000);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    initMap();
    </script>
</body>
</html>
