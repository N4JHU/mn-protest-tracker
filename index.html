<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Cities Live Protest Map - Jan 26, 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hud-panel { position: absolute; background: rgba(0, 0, 0, 0.85); border: 1px solid #444; color: #ddd; padding: 15px; border-radius: 8px; backdrop-filter: blur(10px); z-index: 1000; max-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; width: 280px; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 30px; right: 20px; width: 280px; }
        h2 { margin: 0 0 8px 0; font-size: 1.1rem; color: #ff5555; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #555; padding-bottom: 5px; }
        p { font-size: 0.8rem; margin: 0 0 10px 0; line-height: 1.4; color: #aaa; }
        .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; }
        .pulse-marker { width: 20px; height: 20px; background: rgba(255, 50, 50, 0.8); border-radius: 50%; border: 2px solid white; animation: pulse 2s infinite; }
        .pulse-marker.blue { background: rgba(50, 150, 255, 0.8); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 50, 50, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0); } }
        input[type="range"] { width: 100%; margin: 10px 0; accent-color: #ff5555; cursor: pointer; }
        label { font-size: 0.85rem; color: #eee; font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="hud-panel top-left">
        <h2>Operation Metro Surge</h2>
        <div style="font-size: 0.8rem; color: #ccc;">
            <strong>DATE:</strong> Jan 26, 2026<br>
            <strong>LOCATION:</strong> Twin Cities, MN<br>
            <strong>STATUS:</strong> Live + 6-Month Archive
        </div>
    </div>
    <div class="hud-panel bottom-right">
        <h2>Archive Explorer</h2>
        <label id="time-label">Showing: Last 24 Hours</label>
        <input type="range" id="time-slider" min="0" max="180" value="0" oninput="updateTimeFilter(this.value)">
        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #888;">
            <span>LIVE (24H)</span>
            <span>6 MONTHS AGO</span>
        </div>
        <p style="font-size: 0.7rem; margin-top: 10px; color: #666;">*Auto-refreshing every 60s</p>
    </div>
    <div class="hud-panel bottom-left">
        <h2>Map Key</h2>
        <div><span style="color:#ff3333">●</span> High Tension Zone</div>
        <div><span style="color:#ff9900">●</span> Gathering / Vigil</div>
        <div><span style="color:#3399ff">●</span> Police/Federal Staging</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([44.92, -93.20], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', { attribution: '© CARTO' }).addTo(map);

        const redIcon = L.divIcon({ className: 'pulse-marker', iconSize: [20, 20] });
        const blueIcon = L.divIcon({ className: 'pulse-marker blue', iconSize: [20, 20] });

        let allEvents = [];
        const markersGroup = L.layerGroup().addTo(map);

        async function loadEvents() {
            try {
                const res = await fetch('events.json');
                const data = await res.json();
                allEvents = data.events || [];
                updateTimeFilter(0);
            } catch (e) { console.error("Data error", e); }
        }

        function updateTimeFilter(daysBack) {
            const label = document.getElementById('time-label');
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysBack);
            
            label.innerText = daysBack == 0 ? "Showing: Last 24 Hours" : "Showing: Since " + cutoffDate.toLocaleDateString();
            
            markersGroup.clearLayers();
            const cutoffTime = daysBack == 0 ? Date.now() - 86400000 : cutoffDate.getTime();

            allEvents.forEach(ev => {
                const evTime = new Date(ev.start_time).getTime();
                if (evTime >= cutoffTime) {
                    const icon = (ev.type === 'staging' || ev.tags?.includes('police')) ? blueIcon : redIcon;
                    L.marker([ev.latitude, ev.longitude], {icon: icon})
                        .bindPopup(`<strong>${ev.title}</strong><br><em>${new Date(ev.start_time).toLocaleString()}</em><br>${ev.description}`)
                        .addTo(markersGroup);
                }
            });
        }

        loadEvents();
        setInterval(() => location.reload(), 60000);
    </script>
</body>
</html>
