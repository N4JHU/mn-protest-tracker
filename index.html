<!DOCTYPE html>
<html>
<head>
    <title>Twin Cities Live Protest Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #222; }
        
        .hud-panel { position: absolute; background: rgba(0,0,0,0.9); border: 1px solid #444; color: #ddd; padding: 8px; border-radius: 4px; z-index: 1000; font-size: 11px; }
       /* 25% COMPACT MODE */
        .top-left { 
            top: 10px; 
            left: 10px; 
            width: 135px;       /* Was 180px */
            font-size: 9px;     /* Was 11px */
            padding: 6px;       /* Tighter padding */
        }
        
        .top-left h2 {
            font-size: 0.6rem;  /* Smaller Header */
            margin-bottom: 3px;
        }
        .top-right { top: 10px; right: 10px; width: 160px; max-height: 40vh; overflow-y: auto; text-align: right; }
        
        /* TIMELINE SLIDER BAR */
        .bottom-bar { 
            bottom: 20px; left: 10px; right: 10px; 
            background: rgba(0,0,0,0.9); border: 1px solid #444; 
            padding: 10px; border-radius: 8px; z-index: 1000; display: flex; flex-direction: column; 
        }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        input[type=range] { flex-grow: 1; accent-color: #ff5555; }
        
        h2 { margin: 0 0 5px 0; font-size: 0.75rem; color: #ff5555; border-bottom: 1px solid #ff5555; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        
        /* COLORS */
        .red { color: #ff3333; } .blue { color: #0088ff; } .orange { color: #ffaa00; } .purple { color: #d400ff; }
        
        /* MARKERS */
        .pulse-marker { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px black; }
        .type-protest { background: #ff3333; box-shadow: 0 0 10px #ff3333; }
        .type-police { background: #0088ff; }
        .type-road_closure { background: #ffaa00; }
        .type-report { background: #d400ff; }
        .type-intel { background: #888; }
        .type-user { background: #00ccff; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); } 70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); } }

        /* MODAL */
        #report-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 300px; background: #111; border: 1px solid #d400ff; z-index: 2000; padding: 15px; }
        .form-input, select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 5px; margin-bottom: 10px; }
        .btn { background: #222; border: 1px solid #555; color: #ccc; padding: 4px 8px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="hud-panel top-left">
        <h2>METRO SURGE <span id="clock" style="float:right; color:#888">...</span></h2>
        <div class="info-row"><span>STATUS:</span> <span class="red">LIVE</span></div>
        <div class="info-row"><span>GPS:</span> <label class="switch"><input type="checkbox" id="gps-toggle"> GPS</label></div>
        <div class="info-row" style="margin-top:5px; border-top:1px solid #444"><span>THREATS:</span> <span class="red" id="c-protest">0</span></div>
        <div id="status" style="text-align:right; color:#555; margin-top:5px">...</div>
    </div>

    <div class="hud-panel top-right">
        <h2>INTEL <button class="btn" onclick="openModal()">RPT</button></h2>
        <div id="feed"></div>
    </div>

    <div class="hud-panel bottom-bar">
        <div style="font-size:10px; color:#aaa; margin-bottom:5px; display:flex; justify-content:space-between;">
            <span>HISTORY (-48H)</span>
            <span id="time-label" style="color:#ff5555; font-weight:bold;">LIVE NOW</span>
        </div>
        <div class="slider-container">
            <input type="range" id="time-slider" min="0" max="100" value="100">
        </div>
    </div>

    <div id="report-modal">
        <h2 style="color:#d400ff">FIELD REPORT</h2>
        <input id="geo-input" class="form-input" placeholder="Location...">
        <button class="btn" style="width:100%; margin-bottom:10px" onclick="geoSearch()">FIND</button>
        <select id="rpt-type"><option value="Protest">Threat/Protest</option><option value="Police">Police</option></select>
        <input id="rpt-desc" class="form-input" placeholder="Description...">
        <div style="display:flex; justify-content:space-between">
            <button class="btn" onclick="closeModal()">CANCEL</button>
            <button class="btn" onclick="submitReport()">SUBMIT</button>
        </div>
    </div>

    <script>
        const DB = window.supabase.createClient('https://mymlbldoignrhvkfqcnz.supabase.co', 'sb_publishable_Yce1uZCUK7isWfD7t8c5iA_Yi9OhtVh');
        let map, markers=[], allData=[], userMarker, watchId;
        
        function init() {
            map = L.map('map', {zoomControl:false}).setView([44.9778, -93.2650], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:19}).addTo(map);
            
            loadData();
            
            // Auto Refresh every 60s
            setInterval(loadData, 60000);
            
            // Time Slider Logic
            document.getElementById('time-slider').addEventListener('input', function(e) {
                const val = parseInt(e.target.value);
                filterByTime(val);
            });

            setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
            setupGPS();
        }

        async function loadData() {
            status("SYNC...", "#ea0");
            // Fetch last 48 hours
            const { data } = await DB.from('events').select('*').gt('timestamp', new Date(Date.now()-172800000).toISOString());
            if(data) {
                allData = data; // Store for slider
                // Filter out garbage
                allData = allData.filter(e => !e.title.includes("TRAFFIC: None"));
                
                // If slider is at max (100), show LIVE data
                if(document.getElementById('time-slider').value == 100) {
                    render(allData);
                }
                status("SECURE", "#0f0");
            }
        }

        function filterByTime(val) {
            if(val == 100) {
                document.getElementById('time-label').innerText = "LIVE NOW";
                render(allData);
                return;
            }
            // Calculate cutoff time
            const hoursBack = 48 - (val * 0.48); // Map 0-100 to 48h-0h
            const cutoff = new Date(Date.now() - (hoursBack * 3600000));
            document.getElementById('time-label').innerText = cutoff.toLocaleTimeString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
            
            // Filter: Show events that existed BEFORE cutoff but are NOT TOO OLD
            const subset = allData.filter(e => new Date(e.timestamp) <= cutoff && new Date(e.timestamp) > new Date(cutoff - 86400000));
            render(subset);
        }

        function render(dataset) {
            // CLEAR OLD MARKERS (Fixes the ghosting issue)
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            document.getElementById('feed').innerHTML = "";
            document.getElementById('c-protest').innerText = "0";

            dataset.sort((a,b) => getPriority(b.type) - getPriority(a.type));
            
            let pCount = 0;
            dataset.forEach(e => {
                if(e.type === 'protest') pCount++;
                const z = getPriority(e.type);
                const icon = L.divIcon({className:'', html:`<div class="pulse-marker type-${e.type} pulse"></div>`});
                const m = L.marker([e.lat, e.lng], {icon:icon, zIndexOffset:z}).addTo(map)
                    .bindPopup(`<b style="color:#ff5555">${e.title}</b><br>${e.desc}`);
                markers.push(m);
                
                // Add to feed
                const d = document.createElement('div');
                d.style.marginBottom = "5px"; d.style.borderBottom="1px solid #333";
                d.innerHTML = `<span class="${getColorClass(e.type)}" style="font-weight:bold">${e.title}</span><br><span style="color:#aaa">${e.desc.substring(0,60)}...</span>`;
                document.getElementById('feed').appendChild(d);
            });
            document.getElementById('c-protest').innerText = pCount;
        }

        function getPriority(t) { return t==='protest'?1000 : t==='police'?800 : 100; }
        function getColorClass(t) { return t==='protest'?'red':t==='police'?'blue':'orange'; }
        function status(m,c) { const e=document.getElementById('status'); e.innerText=m; e.style.color=c; }
        function openModal(){document.getElementById('report-modal').style.display='block'}
        function closeModal(){document.getElementById('report-modal').style.display='none'}
        async function submitReport() { /* ... same as before ... */ closeModal(); }
        function geoSearch() { /* ... same as before ... */ }
        function setupGPS() { /* ... same as before ... */ }

        if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
        init();
    </script>
</body>
</html>
