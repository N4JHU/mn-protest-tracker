<!DOCTYPE html>
<html>
<head>
    <title>Twin Cities Live Protest Map</title>
    <style>
        /* --- GLOBAL SETTINGS --- */
        body { margin: 0; padding: 0; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* MAP LAYER */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* --- HUD OVERLAYS --- */
        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            color: #ddd;
            padding: 15px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        
        /* POSITIONING */
        .top-left { top: 20px; left: 20px; width: 300px; }
        .top-right { top: 20px; right: 20px; width: 320px; max-height: 80vh; overflow-y: auto; }
        .bottom-left { bottom: 20px; left: 20px; }
        
        /* TYPOGRAPHY */
        h2 { 
            margin: 0 0 10px 0; 
            font-size: 1.1rem; 
            color: #ff5555; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            border-bottom: 1px solid #ff5555; 
            padding-bottom: 5px; 
        }
        
        .info-row { font-size: 0.85rem; color: #ccc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-weight: bold; color: #888; }
        .info-val { color: #fff; font-weight: bold; }
        .info-val.red { color: #ff5555; }
        .info-val.orange { color: #ffaa00; }

        /* LIVE FEED STYLING */
        .feed-item { 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
            margin-bottom: 10px; 
        }
        .feed-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .feed-date { color: #888; font-size: 0.7rem; font-family: monospace; }
        .feed-time { color: #ff5555; font-size: 0.8rem; font-weight: bold; font-family: monospace; }
        .feed-text { font-size: 0.85rem; line-height: 1.4; color: #bbb; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; }

        /* PULSING MARKERS */
        .pulse-marker {
            width: 14px; height: 14px;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 0 rgba(0, 0, 0, 1);
            border: 2px solid white; 
        }

        .type-protest { background: #ff3333; }
        .type-protest.pulse { animation: pulse-red 2s infinite; }

        .type-road { background: #ffaa00; }
        .type-road.pulse { animation: pulse-orange 2s infinite; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }
        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 170, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0); }
        }

        /* CUSTOM POPUP */
        .gm-style-iw { padding: 0 !important; overflow: hidden !important; background: #1a1a1a !important; color: #ddd !important; border: 1px solid #ff5555; }
        .gm-style-iw-d { overflow: hidden !important; }
        .gm-style-iw-tc { display: none; }
        
        .popup-box { padding: 10px; width: 250px; font-family: 'Segoe UI', sans-serif; }
        .popup-title { color: #ff5555; font-weight: bold; font-size: 14px; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .popup-desc { font-size: 12px; color: #ccc; }
    </style>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQwEfQg_ECrQw744IEqmR-XmxAt2lcT1I&callback=initMap" async defer></script>
</head>
<body>

    <div id="map"></div>

    <div class="hud-panel top-left">
        <h2>Operation Metro Surge</h2>
        
        <div class="info-row" style="border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">
            <span class="info-val" id="clock-display" style="color: #fff; font-family: monospace;">LOADING TIME...</span>
        </div>

        <div class="info-row">
            <span class="info-label">LOCATION:</span>
            <span class="info-val">TWIN CITIES, MN</span>
        </div>
        <div class="info-row">
            <span class="info-label">STATUS:</span>
            <span class="info-val red">LIVE MONITORING</span>
        </div>
        <div class="info-row" style="margin-top:10px; border-top:1px solid #333; padding-top:5px;">
            <span class="info-label">ACTIVE THREATS:</span>
            <span class="info-val red" id="count-protest">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">ROAD CLOSURES:</span>
            <span class="info-val orange" id="count-road">0</span>
        </div>
        
        <div style="font-size: 0.65rem; color: #555; margin-top: 10px; text-align: right;" id="last-updated">Waiting for Sync...</div>
    </div>

    <div class="hud-panel top-right">
        <h2>Live Intel Feed</h2>
        <div id="feed-container">
            <div class="feed-item">
                <div class="feed-header">
                    <span class="feed-date">SYSTEM</span>
                </div>
                <div class="feed-text">Initializing Secure Data Link...</div>
            </div>
        </div>
    </div>

    <div class="hud-panel bottom-left">
        <h2>Map Key</h2>
        <div style="font-size: 0.8rem; line-height: 1.5;">
            <div><span style="color:#ff3333; font-size: 1.2rem;">●</span> High Tension / Threat</div>
            <div><span style="color:#ffaa00; font-size: 1.2rem;">●</span> Road Closure / Hazard</div>
        </div>
    </div>

    <script>
        // --- HELPER: TWIN CITIES TIME FORMATTER ---
        // Forces all times to display as Minneapolis Time (CST/CDT)
        function formatMNTime(dateObj, includeDate = false) {
            // 1. Get Date Part: ( *** Monday 01/26/26 )
            const dateOptions = { 
                timeZone: 'America/Chicago', 
                weekday: 'long', 
                year: '2-digit', 
                month: '2-digit', 
                day: '2-digit' 
            };
            const rawDate = new Intl.DateTimeFormat('en-US', dateOptions).format(dateObj);
            // Reformat "Monday, 01/26/26" to "Monday 01/26/26" (remove comma)
            const dateStr = `( *** ${rawDate.replace(',', '')} )`;

            // 2. Get Time Part: 10:05 AM
            const timeOptions = { 
                timeZone: 'America/Chicago', 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true
            };
            const timeStr = new Intl.DateTimeFormat('en-US', timeOptions).format(dateObj);

            if (includeDate) {
                return { date: dateStr, time: timeStr };
            }
            return timeStr;
        }

        // --- REAL-TIME CLOCK ---
        function startClock() {
            const clockEl = document.getElementById('clock-display');
            setInterval(() => {
                const now = new Date();
                const formatted = formatMNTime(now, true);
                clockEl.innerText = `${formatted.date} ${formatted.time}`;
            }, 1000);
        }
        startClock(); // Start immediately

        // --- GOOGLE MAPS ---
        function initMap() {
            class HTMLMarker extends google.maps.OverlayView {
                constructor(position, type, title, desc, map) {
                    super();
                    this.position = position;
                    this.type = type;
                    this.title = title;
                    this.desc = desc;
                    this.div = null;
                    this.setMap(map);
                }

                onAdd() {
                    const div = document.createElement("div");
                    div.className = `pulse-marker type-${this.type === 'protest' ? 'protest' : 'road'} pulse`;
                    div.addEventListener("click", () => {
                        const content = `
                            <div class="popup-box">
                                <div class="popup-title">${this.title}</div>
                                <div class="popup-desc">${this.desc}</div>
                            </div>
                        `;
                        const infoWindow = new google.maps.InfoWindow({ content: content, position: this.position });
                        infoWindow.open(this.getMap());
                    });
                    this.div = div;
                    const panes = this.getPanes();
                    panes.overlayMouseTarget.appendChild(div);
                }

                draw() {
                    const overlayProjection = this.getProjection();
                    const position = overlayProjection.fromLatLngToDivPixel(this.position);
                    if (this.div) {
                        this.div.style.left = position.x + "px";
                        this.div.style.top = position.y + "px";
                    }
                }

                onRemove() {
                    if (this.div) {
                        this.div.parentNode.removeChild(this.div);
                        this.div = null;
                    }
                }
            }

            const darkStyle = [
                { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
                { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
            ];

            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 11,
                center: { lat: 44.9778, lng: -93.2650 },
                styles: darkStyle, 
                disableDefaultUI: true 
            });

            let activeMarkers = [];

            function updateMapData() {
                fetch('events.json?nocache=' + (new Date()).getTime())
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('last-updated').innerText = "LAST SYNC: " + data.last_updated;
                        
                        activeMarkers.forEach(marker => marker.setMap(null));
                        activeMarkers = [];

                        let pCount = 0;
                        let rCount = 0;
                        const now = new Date();
                        const protestCutoff = new Date(now.getTime() - (48 * 60 * 60 * 1000));
                        let validEvents = [];

                        data.features.forEach(event => {
                            let showEvent = false;
                            if (event.type === 'road_closure') showEvent = true;
                            else if (event.type === 'protest') {
                                if (event.timestamp) {
                                    const t = new Date(event.timestamp);
                                    if (!isNaN(t) && t >= protestCutoff) showEvent = true;
                                } else showEvent = true;
                            }

                            if (showEvent) {
                                validEvents.push(event);
                                const pos = new google.maps.LatLng(event.lat, event.lng);
                                const newMarker = new HTMLMarker(pos, event.type, event.title, event.desc, map);
                                activeMarkers.push(newMarker);

                                if(event.type === 'protest') pCount++;
                                if(event.type === 'road_closure') rCount++;
                            }
                        });

                        document.getElementById('count-protest').innerText = pCount;
                        document.getElementById('count-road').innerText = rCount;
                        updateFeed(validEvents);
                    });
            }

            function updateFeed(events) {
                const container = document.getElementById('feed-container');
                container.innerHTML = "";

                // Sort Newest First
                events.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                const recentEvents = events.slice(0, 15); // Show top 15

                recentEvents.forEach(e => {
                    // Convert Event Time to MN Time
                    let dateDisplay = "LIVE";
                    let timeDisplay = "";
                    
                    if (e.timestamp) {
                        const t = new Date(e.timestamp);
                        const mnTime = formatMNTime(t, true); // Get {date, time}
                        dateDisplay = mnTime.date;
                        timeDisplay = mnTime.time;
                    }

                    const div = document.createElement("div");
                    div.className = "feed-item";
                    div.innerHTML = `
                        <div class="feed-header">
                            <span class="feed-date">${dateDisplay}</span>
                            <span class="feed-time">${timeDisplay}</span>
                        </div>
                        <div class="feed-text">
                            <strong style="color:${e.type === 'protest' ? '#ff5555' : '#ffaa00'}">${e.title}</strong><br>
                            ${e.desc.substring(0, 80)}${e.desc.length > 80 ? '...' : ''}
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            updateMapData();
            setInterval(updateMapData, 60000); 
        }
    </script>
</body>
</html>
