<!DOCTYPE html>
<html>
<head>
    <title>MN Protest & Road Tracker</title>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
        #legend {
            background: white; padding: 10px; margin: 10px; border: 1px solid #ccc;
            font-family: Arial, sans-serif; position: absolute; top: 10px; left: 10px; z-index: 5;
        }
        .dot { height: 10px; width: 10px; display: inline-block; border-radius: 50%; margin-right: 5px; }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQwEfQg_ECrQw744IEqmR-XmxAt2lcT1I&callback=initMap" async defer></script>
</head>
<body>

<div id="legend">
    <h3>Live Tracker</h3>
    <div><span class="dot" style="background:red;"></span>Protest (Live)</div>
    <div><span class="dot" style="background:orange;"></span>Road Closure</div>
    <div id="last-updated" style="margin-top:5px; font-size:0.8em; color:#666;"></div>
</div>

<div id="map"></div>

<script>
    function initMap() {
        const mnCenter = { lat: 44.9778, lng: -93.2650 };
        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 10,
            center: mnCenter,
            mapTypeId: 'roadmap'
        });

        // Load the live data
        fetch('events.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('last-updated').innerText = "Updated: " + data.last_updated;

                data.features.forEach(event => {
                    let color = "gray"; 
                    if (event.type === 'protest') color = "red";
                    if (event.type === 'road_closure') color = "orange";

                    new google.maps.Marker({
                        position: { lat: event.lat, lng: event.lng },
                        map: map,
                        title: event.title,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: color,
                            fillOpacity: 0.8,
                            strokeWeight: 1,
                            strokeColor: "white"
                        }
                    });
                });
            });
    }
</script>
</body>
</html>
