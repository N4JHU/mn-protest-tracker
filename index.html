<!DOCTYPE html>
<html>
<head>
    <title>Twin Cities Live Protest Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #222; }
        
        /* HUD PANELS */
        .hud-panel {
            position: absolute; background: rgba(0, 0, 0, 0.9); border: 1px solid #444; color: #ddd;
            padding: 8px; border-radius: 4px; backdrop-filter: blur(5px); z-index: 1000;
            font-size: 11px;
        }
        
        /* LAYOUT */
        .top-left { top: 10px; left: 10px; width: 180px; }
        .top-right { top: 10px; right: 10px; width: 160px; max-height: 40vh; overflow-y: auto; text-align: right; }
        /* NEW MINI LEGEND */
        .bottom-bar { 
            bottom: 20px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 15px; white-space: nowrap; 
            background: rgba(0,0,0,0.8); border: 1px solid #444; 
            padding: 6px 12px; border-radius: 20px; 
        }
        
        h2 { margin: 0 0 5px 0; font-size: 0.75rem; color: #ff5555; text-transform: uppercase; border-bottom: 1px solid #ff5555; padding-bottom: 2px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .red { color: #ff5555; } .orange { color: #ffaa00; } .purple { color: #d400ff; }

        /* SWITCH */
        .switch { position: relative; display: inline-block; width: 24px; height: 12px; vertical-align: middle; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 12px; }
        .slider:before { position: absolute; content: ""; height: 8px; width: 8px; left: 2px; bottom: 2px; background: #888; border-radius: 50%; transition: .2s; }
        input:checked + .slider { background: #004400; }
        input:checked + .slider:before { transform: translateX(12px); background: #00ff00; }

        /* BUTTONS */
        .tac-btn, .rpt-btn { background: #222; border: 1px solid #555; color: #ccc; padding: 2px 5px; font-size: 10px; cursor: pointer; text-decoration: none; margin-left: 3px; display: inline-block; }
        .tac-btn { border-color: #ff5555; color: #ff5555; }
        .rpt-btn { border-color: #d400ff; color: #d400ff; }

        /* MARKERS */
        .pulse-marker { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px black; }
        .type-protest { background: #ff3333; }
        .type-road { background: #ffaa00; }
        .type-user { background: #00ccff; }
        .type-report { background: #d400ff; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0,0,0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0, 0); } }

        /* MODAL */
        #report-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 300px; background: #111; border: 1px solid #d400ff; z-index: 2000; padding: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-input, select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 5px; }
        
        /* LEGEND DOTS */
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-panel top-left">
        <h2>METRO SURGE <span id="clock-display" style="color:#888; float:right; font-size:9px;">...</span></h2>
        <div class="info-row"><span>STATUS:</span> <span class="red">LIVE</span></div>
        <div class="info-row">
            <span>MY POS:</span> 
            <label class="switch"><input type="checkbox" id="user-loc-toggle"><span class="slider"></span></label>
        </div>
        <div class="info-row" style="margin-top:5px; border-top:1px solid #333; padding-top:2px;">
            <span>THREATS:</span> <span class="red" id="count-protest">0</span>
        </div>
        <div class="info-row"><span>REPORTS:</span> <span class="purple" id="count-report">0</span></div>
        <div id="connection-status" style="font-size:9px; color:#555; text-align:right; margin-top:3px;">Connecting...</div>
    </div>

    <div class="hud-panel top-right">
        <h2>INTEL <button class="rpt-btn" onclick="openReportModal()">RPT</button></h2>
        <div id="feed-container"></div>
    </div>

    <div class="hud-panel bottom-bar">
        <div><span class="dot" style="background:#ff3333"></span>Threat</div>
        <div><span class="dot" style="background:#ffaa00"></span>Road</div>
        <div><span class="dot" style="background:#d400ff"></span>User</div>
    </div>

    <div id="report-modal">
        <h2 style="color:#d400ff">FIELD REPORT</h2>
        <div class="form-group">
            <input type="text" id="geo-input" class="form-input" placeholder="Location (e.g. Lake St)">
            <button class="tac-btn" style="width:100%; margin-top:5px;" onclick="performGeoSearch()">FIND LOCATION</button>
            <div id="geo-status" style="font-size:10px; color:#888; margin-top:2px;">* Finds center if empty</div>
        </div>
        <select id="rpt-type" class="form-group"><option value="Protest">Protest</option><option value="Police">Police</option><option value="Traffic">Traffic</option></select>
        <input type="text" id="rpt-desc" class="form-input form-group" placeholder="Description...">
        <div style="display:flex; justify-content:space-between;">
            <button class="tac-btn" onclick="closeReportModal()">CANCEL</button>
            <button class="rpt-btn" onclick="submitReport()">SUBMIT</button>
        </div>
    </div>

    <script>
        const SB_URL = 'https://mymlbldoignrhvkfqcnz.supabase.co'; 
        const SB_KEY = 'sb_publishable_Yce1uZCUK7isWfD7t8c5iA_Yi9OhtVh';
        const metroDB = window.supabase.createClient(SB_URL, SB_KEY);

        let map, activeMarkers=[], foundLocation=null, userMarker=null, watchId=null;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([44.9778, -93.2650], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            loadInitialData();
            metroDB.channel('live').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, p => {
                plotEvent(p.new); 
                document.getElementById('connection-status').innerText="RX DATA..."; setTimeout(()=>{document.getElementById('connection-status').innerText="SECURE"},1000);
            }).subscribe();
            
            document.getElementById('user-loc-toggle').addEventListener('change', function() {
                if(this.checked && navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(pos => {
                        const lat=pos.coords.latitude, lng=pos.coords.longitude;
                        if(userMarker) map.removeLayer(userMarker);
                        userMarker = L.marker([lat,lng], {icon: L.divIcon({className:'', html:'<div class="pulse-marker type-user pulse"></div>'})}).addTo(map);
                        map.setView([lat,lng], 14);
                    }, e => { alert("GPS Error"); this.checked=false; }, {enableHighAccuracy:true});
                } else {
                    if(watchId) navigator.geolocation.clearWatch(watchId);
                    if(userMarker) map.removeLayer(userMarker);
                }
            });
        }

        async function loadInitialData() {
            const { data } = await metroDB.from('events').select('*').gt('timestamp', new Date(Date.now()-86400000).toISOString());
            if(data) {
                let p=0, r=0;
                document.getElementById('feed-container').innerHTML = "";
                data.forEach(e => { plotEvent(e); if(e.type=='protest') p++; if(e.type=='report') r++; });
                document.getElementById('count-protest').innerText = p;
                document.getElementById('count-report').innerText = r;
                document.getElementById('connection-status').innerText = "SECURE";
                document.getElementById('connection-status').style.color = "#00ff00";
            }
        }

        function plotEvent(e) {
            const icon = L.divIcon({ className:'', html:`<div class="pulse-marker type-${e.type} pulse"></div>` });
            const m = L.marker([e.lat, e.lng], {icon}).addTo(map).bindPopup(`<b style="color:${e.type=='report'?'#d400ff':'#ff5555'}">${e.title}</b><br>${e.desc}`);
            activeMarkers.push(m);
            const d = document.createElement('div');
            d.innerHTML = `<div style="border-bottom:1px solid #333; margin-bottom:4px; padding-bottom:4px; font-size:10px;"><span style="color:${e.type=='report'?'#d400ff':'#ff5555'}">${e.title}</span><br>${e.desc}</div>`;
            const c = document.getElementById('feed-container'); c.insertBefore(d, c.firstChild);
        }

        function performGeoSearch() {
            const q = document.getElementById('geo-input').value;
            if(!q) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q} Minnesota`).then(r=>r.json()).then(d=>{
                if(d[0]) { foundLocation={lat:d[0].lat, lng:d[0].lon}; map.setView([d[0].lat,d[0].lon], 15); document.getElementById('geo-status').innerText="LOCKED"; document.getElementById('geo-status').style.color="#0f0"; }
            });
        }

        async function submitReport() {
            const t = document.getElementById('rpt-type').value, d = document.getElementById('rpt-desc').value;
            if(!d) return alert("Desc required");
            const loc = foundLocation || map.getCenter();
            await metroDB.from('events').insert([{ id:`usr-${Date.now()}`, title:`RPT: ${t}`, desc:d, type:'report', lat:loc.lat||loc.lat(), lng:loc.lng||loc.lng(), timestamp:new Date().toISOString() }]);
            closeReportModal();
        }

        function openReportModal(){document.getElementById('report-modal').style.display='block'}
        function closeReportModal(){document.getElementById('report-modal').style.display='none'}
        setInterval(()=>{document.getElementById('clock-display').innerText=new Date().toLocaleTimeString()},1000);

        if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
        initMap();
    </script>
</body>
</html>
